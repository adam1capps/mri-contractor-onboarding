# Netlify config for the contractor-onboarding project.
# Static site publishes from the repo root (training/index.html, _redirects).
# API routes are Netlify Functions v2 with custom paths, see netlify/functions/.

[build]
  publish = "."

[build.environment]
  # Functions use node: builtins and modern globals; pin the runtime rather
  # than inheriting whatever Netlify's default happens to be.
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
